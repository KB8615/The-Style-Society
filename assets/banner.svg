<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="The Style Society of Chitkara University" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <path id="star" d="M12 0 C12.8 7.4 16.6 11.2 24 12 C16.6 12.8 12.8 16.6 12 24 C11.2 16.6 7.4 12.8 0 12 C7.4 11.2 11.2 7.4 12 0Z"/>
    <path id="jacket" d="M32 4 L50 18 L68 4 L90 14 L98 50 L84 54 L84 126 L16 126 L16 54 L2 50 L10 14 Z"/>
    <path id="vest" d="M26 4 L50 24 L74 4 L90 24 L86 114 L14 114 L10 24 Z"/>
    <path id="dress" d="M24 4 L32 4 L45 26 L58 4 L66 4 L70 44 L56 62 L88 166 H2 L34 62 L20 44 Z"/>
    <path id="tee" d="M34 4 Q55 22 76 4 L106 24 L95 48 L82 42 V96 H28 V42 L15 48 L4 24 Z"/>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="13" cy="13" r="1.6" fill="#ffffff" fill-opacity=".16"/></pattern>
  </defs>

  <!-- purple field -->
  <rect width="1200" height="420" fill="#8b5cff"/>
  <rect width="1200" height="420" fill="url(#dots)"/>

  <!-- black arch -->
  <path d="M290 420 V320 A310 310 0 0 1 910 320 V420 Z" fill="#000"/>

  <!-- title with offset shadow, like the hiring poster -->
  <g font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" text-anchor="middle">
    <g fill="#4a1fb0">
      <text x="606" y="171" font-size="84" textLength="430" lengthAdjust="spacingAndGlyphs">The Style</text>
      <text x="606" y="259" font-size="92" textLength="380" lengthAdjust="spacingAndGlyphs">Society</text>
    </g>
    <g fill="#fff">
      <text x="600" y="165" font-size="84" textLength="430" lengthAdjust="spacingAndGlyphs">The Style</text>
      <text x="600" y="253" font-size="92" textLength="380" lengthAdjust="spacingAndGlyphs">Society</text>
    </g>
  </g>
  <text x="600" y="297" text-anchor="middle" font-family="'Abril Fatface',Georgia,'Times New Roman',serif" font-size="25" fill="#e8571f" textLength="290" lengthAdjust="spacingAndGlyphs">of Chitkara University</text>

  <!-- green pill -->
  <rect x="405" y="338" width="390" height="52" rx="26" fill="#1b5e3a"/>
  <text x="600" y="371" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="18" fill="#ffd93b" textLength="330" lengthAdjust="spacingAndGlyphs">fashion  ·  expression  ·  freedom  ·  fun</text>

  <!-- left rail -->
  <g stroke="#16304a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M30 76 H272" stroke="#f6f3ef" stroke-width="4"/>
    <g fill="none" stroke="#f6f3ef"><path d="M105 94 L73 106 H137 Z"/><path d="M105 94 C105 86 111 86 111 80"/></g>
    <g fill="none" stroke="#f6f3ef"><path d="M205 94 L173 106 H237 Z"/><path d="M205 94 C205 86 211 86 211 80"/></g>
    <use href="#jacket" transform="translate(60 112) scale(.9)" fill="#f2391f"/>
    <use href="#vest" transform="translate(165 112) scale(.8)" fill="#ffd93b"/>
  </g>

  <!-- right rail -->
  <g stroke="#16304a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M928 76 H1170" stroke="#f6f3ef" stroke-width="4"/>
    <g fill="none" stroke="#f6f3ef"><path d="M975 94 L943 106 H1007 Z"/><path d="M975 94 C975 86 981 86 981 80"/></g>
    <g fill="none" stroke="#f6f3ef"><path d="M1078 94 L1046 106 H1110 Z"/><path d="M1078 94 C1078 86 1084 86 1084 80"/></g>
    <use href="#dress" transform="translate(940 112) scale(.75)" fill="#f58ac8"/>
    <use href="#tee" transform="translate(1032 112) scale(.85)" fill="#2a54d6"/>
  </g>

  <!-- sparkles -->
  <g>
    <use href="#star" x="60" y="290" width="46" height="46" fill="#ffd93b"/>
    <use href="#star" x="196" y="330" width="26" height="26" fill="#fff"/>
    <use href="#star" x="120" y="360" width="20" height="20" fill="#fcd0ec"/>
    <use href="#star" x="1090" y="280" width="52" height="52" fill="#fcd0ec"/>
    <use href="#star" x="990" y="340" width="26" height="26" fill="#ffd93b"/>
    <use href="#star" x="1150" y="360" width="22" height="22" fill="#fff"/>
    <use href="#star" x="330" y="70" width="22" height="22" fill="#ffd93b"/>
    <use href="#star" x="846" y="64" width="26" height="26" fill="#fff"/>
  </g>
</svg>
